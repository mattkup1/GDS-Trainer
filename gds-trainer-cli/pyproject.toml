[project]
name = "gds-trainer-cli"
version = "0.1.0"
description = "Terminal (CLI) edition of GDS Trainer — a GDS terminal simulator for training"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.scripts]
gds-trainer = "gds_trainer.repl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gds_trainer*"]

# No package-data: reference data, airport data, and the command grammar are loaded
# directly from ../spec/ at runtime (shared with the browser edition, see spec/README.md).
# This only works run from a repo checkout (editable install), matching how this CLI is
# installed today - see gds-trainer-cli/README.md.
