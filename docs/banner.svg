<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <radialGradient id="glowbg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#33ff66" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#33ff66" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#33ff66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#000000" opacity="0.22"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="#07090a"/>
  <rect width="1280" height="320" fill="url(#glowbg)"/>

  <rect x="0" y="0" width="1280" height="320" fill="none" stroke="#1c9e42" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="10" y="10" width="1260" height="300" fill="none" stroke="#1c9e42" stroke-opacity="0.18" stroke-width="1"/>

  <g font-family="'IBM Plex Mono','Courier New',monospace" fill="#33ff66">
    <text x="64" y="70" font-size="15" letter-spacing="3" fill="#1c9e42">GDS TRAINER &#8226; TERMINAL EMULATOR</text>

    <text x="64" y="150" font-size="56" font-weight="700" letter-spacing="2" filter="url(#softGlow)">GDS TRAINER</text>

    <text x="64" y="190" font-size="18" fill="#1c9e42" letter-spacing="1">Learn real GDS entry mnemonics on a synthetic, offline booking engine.</text>

    <g font-size="17" fill="#33ff66">
      <text x="64" y="240">&gt; SI</text>
      <text x="64" y="266">SIGNED IN &#8226; PCC 7X72 &#8226; READY</text>
    </g>
    <rect x="220" y="228" width="11" height="20" fill="#33ff66">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="1216" y="266" font-size="13" text-anchor="end" fill="#1c9e42" letter-spacing="1">WEB &#8226; CLI</text>
  </g>

  <rect width="1280" height="320" fill="url(#scanlines)"/>
  <rect width="1280" height="320" fill="url(#vignette)"/>
</svg>
